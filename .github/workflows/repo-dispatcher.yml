#=================================================
# Modified for 兆能 M2 (ipq60xx/zn-m2)
#=================================================

name: Repo Dispatcher

on:
  workflow_dispatch:
    inputs:
      target:                # 新增：设备架构
        description: 'Target architecture (e.g. qualcommax_ipq60xx)'
        required: true
        default: 'qualcommax_ipq60xx'
      profile:              # 新增：设备型号
        description: 'Device profile (e.g. zn-m2)'
        required: true
        default: 'zn-m2'
      param:                # 保留原始参数
        description: 'Extra parameters (optional)'
        required: false
        default: ''

env:
  TOKEN_KIDDIN9: ${{ secrets.TOKEN_KIDDIN9 }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Cancel running workflows
      uses: styfle/cancel-workflow-action@main
      if: contains(github.event.inputs.param, 'cw')
      with:
        workflow_id: all
        access_token: ${{ secrets.TOKEN_KIDDIN9 }}

    - name: Load Settings.ini
      run: |
        source "${GITHUB_WORKSPACE}/devices/common/settings.ini"
        if [ -f "devices/${{ github.event.inputs.target }}/settings.ini" ]; then
          source "${GITHUB_WORKSPACE}/devices/${{ github.event.inputs.target }}/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV

    - name: Trigger Compile
      run: |
        sudo timedatectl set-timezone "$TZ"
        curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.TOKEN_KIDDIN9 }}" \
          -d '{
            "event_type": "${{ github.event.inputs.target }} ${{ github.event.inputs.param }}",
            "client_payload": {
              "target": "${{ github.event.inputs.target }}",
              "profile": "${{ github.event.inputs.profile }}",
              "param": "${{ github.event.inputs.param }}"
            }
          }'
